version: '3.8'

services:
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  worker-dev:
      build: .
      command: celery -A myapp worker --loglevel=info
      volumes:
        - .:/app
      working_dir: /app
      depends_on:
        - redis

  flower-dev:
    image: mher/flower:2.0
    container_name: flower-dev
    command: celery --broker=redis://redis:6378/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6378/0
      - CELERY_RESULT_BACKEND=redis://redis:6378/0
    depends_on:
      - redis-dev

volumes:
  redis_data:
